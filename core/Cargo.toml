[package]
name = "fresh-core"
edition.workspace = true
version.workspace = true

[lib]
name = "fresh_core"

[dependencies]
libc = "0.2.189"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uniffi = { version = "0.32.2", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# UniFFI derives and the exported API the Swift app links against.
ffi = ["dep:uniffi"]
